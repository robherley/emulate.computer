name: Release assets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.3.0
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: docker/setup-qemu-action@v4.3.0
        with:
          platforms: riscv64
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/guest-build-cache
          key: guest-${{ runner.os }}-${{ hashFiles('guest/**') }}
          restore-keys: guest-${{ runner.os }}-
      - run: npm ci
      - run: npm run build:release
        env:
          GUEST_BUILD_CACHE: ${{ runner.temp }}/guest-build-cache
      - run: npm run typecheck && npm test --workspace web
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "assets-$GITHUB_SHA" target/release-assets/* \
            --target "$GITHUB_SHA" --title "Assets $GITHUB_SHA" \
            --notes 'Guest images, boot snapshot, asset manifest, and Wasm bindings.'
