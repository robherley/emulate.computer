<!doctype html>
<meta charset="utf-8">
<title>Guest CPU benchmark</title>
<h1>Guest CPU benchmark</h1>
<p>Interpreter in a dedicated worker, 50,000 instructions per Wasm call.</p>
<button id="run">Run benchmark</button>
<button id="linux">Run Linux workloads</button>
<pre id="output">Ready</pre>
<script type="module">
  window.runCpuBenchmark = (moduleUrl = '/src/wasm/emulate_wasm.js', options = {}) => new Promise((resolve, reject) => {
    const worker = new Worker('./fixtures/cpu-benchmark-worker.mjs', { type: 'module' });
    const timeout = setTimeout(() => finish(new Error('Benchmark exceeded five minutes')), 300_000);
    const finish = (error, result) => {
      clearTimeout(timeout);
      worker.terminate();
      if (error) reject(error);
      else resolve(result);
    };
    worker.onerror = event => finish(new Error(event.message));
    worker.onmessage = ({ data }) => {
      if (data.progress) {
        document.querySelector('#output').textContent = data.progress;
      } else finish(data.error ? new Error(data.error) : null, data.results);
    };
    worker.postMessage({ ...options, moduleUrl: new URL(moduleUrl, location.href).href });
  });
  async function showBenchmark(options) {
    const output = document.querySelector('#output');
    output.textContent = 'Running…';
    const buttons = document.querySelectorAll('button');
    buttons.forEach(button => button.disabled = true);
    try { output.textContent = JSON.stringify(await runCpuBenchmark(undefined, options), null, 2); }
    catch (error) { output.textContent = String(error); }
    finally { buttons.forEach(button => button.disabled = false); }
  }
  document.querySelector('#run').onclick = () => showBenchmark({});
  document.querySelector('#linux').onclick = () => showBenchmark({ linux: true, samples: 3 });
</script>
